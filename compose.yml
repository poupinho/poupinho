services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: economiza
      POSTGRES_PASSWORD: economiza
      POSTGRES_DB: economiza_development
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U economiza"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    user: "${UID:-1001}:${GID:-1001}"
    command: bin/rails server -b 0.0.0.0 -p 3000
    volumes:
      - .:/app
      - bundle_cache:/usr/local/bundle
    ports:
      - "3002:3000"
    environment:
      DB_HOST: db
      DB_USER: economiza
      DB_PASSWORD: economiza
      RAILS_ENV: development
      BINDING: 0.0.0.0
      HOME: /tmp
      RUBOCOP_CACHE_ROOT: /app/tmp/rubocop
      # Web Push (lembretes). Valores vêm do .env do host (docker compose lê o .env para substituição).
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-https://poupinho.com.br}
      # Login com Google (OAuth). Valores do .env do host.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      # Analytics (Google Analytics 4). Deixe vazio em dev para não sujar os números.
      GA_MEASUREMENT_ID: ${GA_MEASUREMENT_ID:-}
    depends_on:
      db:
        condition: service_healthy
    tty: true
    stdin_open: true

volumes:
  pg_data:
  bundle_cache:
