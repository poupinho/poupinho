      steps_title: Como colocar em prática
      math_title: De onde vem a estimativa
      related_title: "Outras dicas de %{group}"
      back: Ver todas as dicas
      cta_title: Registre essa economia
      cta_text: Toda vez que você seguir esta dica, anote o valor que ficou no bolso e veja o total crescer.
      cta_button: Registrar economia
      public_cta_title: Guarde o valor que você não gastou
      public_cta_text: O Poupinho anota cada gasto evitado e mostra quanto isso vira no fim do mês e do ano. É grátis e leva menos de um minuto para começar.
      public_cta_button: Criar conta grátis
    groups:
      - slug: alimentacao
        title: Alimentação
        icon: bi-egg-fried
        color: "#f59e0b"
        items:
          - slug: marmita-dois-dias-por-semana
            icon: bi-basket
            title: Marmita dois dias por semana
            text: Não precisa ser todo dia. Dois almoços de casa por semana já mudam o mês, e ainda dá para variar o cardápio.
            saving: "≈ R$ 160 por mês"
            description: "Levar marmita dois dias por semana pode guardar cerca de R$ 160 por mês. Veja o passo a passo para começar sem virar rotina chata."
            body:
              - A marmita costuma fracassar quando você promete levar todo dia. Na segunda semana, o cansaço vence e a ideia morre inteira. Duas vezes por semana é uma meta que sobrevive a semanas ruins.
              - A diferença de preço fala por si. Um almoço fora em cidade média fica na casa dos vinte reais, enquanto a porção equivalente feita em casa custa uma fração disso. O que interessa não é o valor de um dia, é o que oito almoços por mês somam.
            steps:
              - Escolha dois dias fixos da semana, de preferência aqueles em que você já cozinha à noite.
              - Cozinhe uma quantidade maior no jantar da véspera e separe a porção antes de servir.
              - Deixe os potes já prontos na geladeira, para não decidir nada de manhã.
              - Registre no Poupinho o valor do almoço que você deixou de comprar, no mesmo dia.
            math: Dois almoços por semana dão cerca de oito por mês. Considerando uma diferença de vinte reais entre comer fora e levar de casa, o mês fecha perto de cento e sessenta reais.
          - slug: cafe-da-casa
            icon: bi-cup-hot
            title: Café da casa, não da esquina
            text: O cafezinho de todo dia é a economia mais fácil de registrar. Leve numa garrafinha térmica e anote o valor que não gastou.
            saving: "≈ R$ 100 por mês"
            description: "Trocar o café comprado pelo café de casa rende cerca de R$ 100 por mês. Um hábito diário, fácil de manter e fácil de registrar."
            body:
              - O café comprado fora é o gasto invisível mais comum. Some pouco por vez, acontece todo dia útil e nunca aparece como um problema na fatura, porque está diluído em dezenas de lançamentos pequenos.
              - É justamente por isso que ele é a melhor dica para começar. A troca é indolor, o resultado aparece rápido e você tem uma economia para registrar todo santo dia, o que mantém a sequência viva.
            steps:
              - Compre uma garrafa térmica pequena, de tamanho que caiba na mochila.
              - Prepare o café junto com o resto do café da manhã, sem criar uma etapa nova no seu dia.
              - Mantenha o hábito nos dias de trabalho e libere o fim de semana, para não virar privação.
              - Anote o preço do café que você não comprou, mesmo que seja um valor pequeno.
            math: Um café por dia útil dá cerca de vinte e dois por mês. Com uma diferença de aproximadamente cinco reais entre o café da cafeteria e o de casa, o mês fecha perto de cem reais.
          - slug: lista-de-compras-fechada
            icon: bi-list-check
            title: Lista de compras fechada
            text: Vá ao mercado com lista e sem fome. Tudo que ficou fora do carrinho e você deixou de comprar por impulso conta como economia.
            saving: "≈ R$ 80 por compra"
            description: "Ir ao mercado com lista fechada e sem fome corta as compras por impulso. Veja como montar a lista e o que registrar como economia."
            body:
              - Supermercado é um ambiente desenhado para você comprar mais do que planejou. A disposição das prateleiras, a música e as promoções de fim de corredor existem para isso. Lista fechada é a única defesa que funciona sem esforço.
              - Fechada quer dizer que ela não aceita adições dentro da loja. Se você lembrar de algo importante, anote para a próxima compra. Na prática, quase nada do que aparece no meio do caminho era realmente necessário.
            steps:
              - Monte a lista em casa, olhando a geladeira e o armário antes de escrever.
              - Coma alguma coisa antes de sair. Fome no mercado custa caro.
              - No corredor, pegue só o que está na lista e siga em frente.
              - Ao sair, anote o valor do que você quase colocou no carrinho e devolveu.
            math: A estimativa vem da diferença comum entre uma compra planejada e uma compra por impulso numa ida grande ao mercado, que costuma girar em torno de oitenta reais.
          - slug: delivery-em-dia-combinado
            icon: bi-bag-x
            title: Delivery só em dia combinado
            text: Escolha um dia da semana para pedir e resista nos outros. Cada taxa de entrega e cada pedido evitado vai para o cofrinho.
            saving: "≈ R$ 200 por mês"
            description: "Restringir o delivery a um dia fixo da semana pode guardar cerca de R$ 200 por mês, sem cortar o prazer da comida pedida."
            body:
              - O problema do delivery não é o preço do prato, é a frequência. Pedir vira o padrão nos dias em que você chega cansado, e a decisão acontece antes de você perceber que está decidindo.
              - Marcar um dia fixo resolve isso sem transformar a comida pedida em culpa. Você continua pedindo, só que uma vez por semana, com vontade, em vez de quatro vezes por inércia.
            steps:
              - Escolha o dia da semana em que pedir faz mais sentido para você, normalmente sexta ou sábado.
              - Deixe algo simples e rápido pronto na geladeira para os dias em que a tentação bater.
              - Tire os aplicativos de entrega da tela inicial do celular.
              - Nos dias em que você resistiu, registre o valor do pedido que não aconteceu, somando a taxa de entrega.
            math: Trocar três pedidos por semana por um só evita cerca de oito pedidos por mês. Com prato e taxa somando algo perto de vinte e cinco reais, o mês passa de duzentos reais.
      - slug: transporte
        title: Transporte
        icon: bi-bus-front
        color: "#3b82f6"
        items:
          - slug: trajetos-curtos-a-pe
            icon: bi-person-walking
            title: Trajetos curtos a pé ou de bike
            text: Até dois quilômetros, ir a pé costuma ser quase tão rápido quanto chamar um carro. Registre o valor da corrida que não aconteceu.
            saving: "≈ R$ 15 por trajeto"
            description: "Em trajetos de até dois quilômetros, ir a pé ou de bicicleta custa nada e demora quase o mesmo. Veja quando a troca compensa."
            body:
              - Em trajeto curto dentro da cidade, o carro de aplicativo perde boa parte da vantagem. Você espera o motorista chegar, enfrenta o mesmo trânsito e ainda paga a tarifa mínima, que existe justamente para tornar a corrida curta rentável para a plataforma.
              - Dois quilômetros a pé levam por volta de vinte e cinco minutos. Considerando a espera, a diferença real de tempo costuma ser bem menor do que parece na hora de decidir.
            steps:
              - Antes de chamar o carro, olhe a distância no mapa.
              - Se for até dois quilômetros e o clima ajudar, vá a pé ou de bicicleta.
              - Saia cinco minutos antes para não transformar a escolha em correria.
              - Registre o valor da corrida que o aplicativo mostrou e você não pagou.
            math: A estimativa usa a tarifa comum de uma corrida curta de aplicativo em cidade brasileira, que costuma ficar em torno de quinze reais com a taxa mínima.
          - slug: carona-e-transporte-publico
            icon: bi-people
            title: Carona e transporte público
            text: Combine carona com colegas ou use ônibus e metrô nos dias em que a pressa não manda. A diferença para o app de corrida é grande.
            saving: "≈ R$ 120 por mês"
            description: "Trocar o carro de aplicativo por carona ou transporte público em parte dos dias rende cerca de R$ 120 por mês."
            body:
              - Não se trata de abandonar o aplicativo. Se trata de reconhecer que em alguns dias você paga por pressa que não existe, só por hábito.
              - Escolha os dias em que o horário é flexível e deixe o carro para quando ele realmente resolve um problema. A economia por dia é pequena, mas o padrão semanal é o que pesa no fim do mês.
            steps:
              - Identifique dois dias da semana em que você não tem compromisso logo na chegada.
              - Combine carona com colegas que fazem o mesmo trajeto, dividindo o combustível.
              - Nos outros dias flexíveis, use ônibus ou metrô e aproveite o tempo para ler ou ouvir algo.
              - Registre a diferença entre o que você pagaria no aplicativo e o que gastou de fato.
            math: Dois trajetos por semana dão cerca de oito por mês. Com uma diferença de aproximadamente quinze reais entre o aplicativo e a alternativa, o mês fecha perto de cento e vinte reais.
          - slug: abastecer-com-comparacao
            icon: bi-fuel-pump
            title: Abasteça com comparação
            text: Um app de preços de combustível e um pouco de planejamento evitam encher o tanque no posto mais caro do caminho.
            saving: "≈ R$ 30 por tanque"
            description: "Comparar o preço do combustível antes de abastecer evita cerca de R$ 30 por tanque. Vale quando o posto está no seu caminho."
            body:
              - A diferença de preço entre postos de um mesmo bairro costuma ser maior do que as pessoas imaginam. Quem abastece sempre no posto mais próximo paga essa diferença todo mês sem notar.
              - A regra que evita autoengano é simples. Só vale trocar de posto se ele estiver na sua rota normal. Dirigir vários quilômetros para economizar alguns centavos por litro consome no combustível o que você economizou no preço.
            steps:
              - Instale um aplicativo de comparação de preço de combustível.
              - Descubra o posto mais barato que já fica no seu trajeto do dia a dia.
              - Evite abastecer no vermelho, porque a pressa tira sua liberdade de escolha.
              - Registre a diferença entre o preço do posto habitual e o que você pagou.
            math: A estimativa considera um tanque de quarenta litros e uma diferença de preço em torno de setenta e cinco centavos por litro entre os postos da mesma região.
      - slug: assinaturas-e-compras
        title: Assinaturas e compras
        icon: bi-tv
        color: "#8b5cf6"
        items:
          - slug: cancele-o-que-nao-usa
            icon: bi-x-circle
            title: Cancele o que você não abre
            text: Olhe a fatura do cartão e marque cada assinatura que não usou no último mês. Cancelou? Registre o valor mensal como economia.
            saving: "≈ R$ 40 por assinatura"
            description: "Assinaturas esquecidas saem da conta todo mês em silêncio. Veja como fazer a auditoria da fatura e cancelar o que você não usa."
            body:
              - Assinatura é o gasto mais fácil de esquecer porque ele não pede sua permissão duas vezes. Você autorizou uma vez, no dia em que fazia sentido, e a cobrança continua muito depois de você ter parado de usar o serviço.
              - A auditoria leva quinze minutos e costuma render mais que qualquer outro corte único. Faça uma vez por semestre e você raramente carrega um serviço morto por mais de alguns meses.
            steps:
              - Abra a fatura completa do cartão dos últimos três meses.
              - Marque toda cobrança recorrente, inclusive as que estão em dólar.
              - Para cada uma, pergunte se você usou nos últimos trinta dias. Se não usou, cancele agora.
              - Registre o valor mensal de cada assinatura cancelada como economia recorrente.
            math: A estimativa usa o preço médio de uma assinatura de streaming ou serviço digital no Brasil, que costuma ficar em torno de quarenta reais por mês.
          - slug: regra-das-48-horas
            icon: bi-hourglass-split
            title: Regra das 48 horas
            text: "Viu algo que quer comprar? Espere dois dias. Se a vontade passar, anote o preço do que você não comprou."
            saving: Você decide o valor
            description: "Esperar dois dias antes de comprar por impulso derruba boa parte das compras desnecessárias. Veja como aplicar a regra das 48 horas."
            body:
              - A compra por impulso depende de um estado emocional que não dura. A propaganda, a vitrine ou o vídeo criam uma urgência artificial, e a urgência é o único ingrediente que a espera destrói.
              - Passadas quarenta e oito horas, a maior parte dos desejos simplesmente evapora. Os que sobrevivem costumam ser compras que valem a pena, e você as faz com muito mais tranquilidade.
            steps:
              - Ao querer comprar algo que não estava planejado, coloque no carrinho e feche o aplicativo.
              - Anote o item e a data numa lista de espera.
              - Volte depois de dois dias e decida com a cabeça fria.
              - Se desistiu, registre o preço do item como economia.
            math: Não há estimativa fixa aqui, porque o valor depende do que você quase comprou. Registre o preço real do item que ficou para trás.
          - slug: conserte-antes-de-trocar
            icon: bi-arrow-repeat
            title: Conserte antes de trocar
            text: Tênis, fone, celular com a tela trincada. Consertar costuma custar uma fração do novo, e a diferença é economia registrada.
            saving: "≈ R$ 300 por item"
            description: "Consertar costuma custar bem menos que substituir. Veja quando o reparo compensa e como registrar a diferença como economia."
            body:
              - A indústria treinou todo mundo a tratar conserto como coisa do passado, mas em várias categorias o reparo continua fazendo sentido. Sapato, roupa, bicicleta, eletrodoméstico e tela de celular são os casos mais claros.
              - A regra prática é comparar o orçamento do conserto com o preço do item novo. Quando o reparo fica abaixo de metade, ele quase sempre vale, ainda mais se o produto já provou ser bom.
            steps:
              - Antes de comprar o substituto, peça um orçamento de conserto.
              - Compare o orçamento com o preço real do item novo, não com o preço que você imagina.
              - Se o conserto ficar abaixo de metade do valor do novo, conserte.
              - Registre a diferença entre o preço do novo e o que você pagou no reparo.
            math: A estimativa considera itens de valor médio, como um par de tênis ou a tela de um celular, em que a diferença entre trocar e consertar costuma passar de trezentos reais.
          - slug: compare-antes-de-fechar
            icon: bi-tag
            title: Compare antes de fechar
            text: Três minutos comparando preços em outra loja ou com cupom valem a pena. A diferença entre o preço que você viu e o que pagou é sua.
            saving: "≈ 10% por compra"
            description: "Três minutos comparando preço e cupom antes de fechar a compra costumam render cerca de 10% de desconto. Veja como fazer isso rápido."
            body:
              - Comparar preço deixou de ser trabalhoso. Buscar o nome exato do produto leva menos tempo do que escolher a cor, e a diferença entre a primeira loja e a mais barata costuma surpreender.
              - Vale colocar um limite de tempo. Três minutos capturam quase toda a economia possível. Passar tarde inteira caçando o menor preço transforma a economia em prejuízo de tempo.
            steps:
              - Copie o nome exato do produto e busque em outros dois sites.
              - Cheque se existe cupom ou cashback ativo para a loja escolhida.
              - Some o frete antes de comparar, porque ele muda o resultado.
              - Registre a diferença entre o primeiro preço que você viu e o que pagou.
            math: A estimativa usa uma diferença de cerca de dez por cento entre a primeira oferta encontrada e a melhor oferta disponível numa compra comum pela internet.
      - slug: habitos-e-metas
        title: Hábitos e metas
        icon: bi-bullseye
        color: "#10b981"
        items:
          - slug: um-nao-por-dia
            icon: bi-fire
            title: Um "não" por dia
            text: A sequência de dias existe para isso. Escolha um gasto pequeno para evitar todo dia e registre. O hábito vale mais que o valor.
            saving: "≈ R$ 150 por mês"
            description: "Evitar um gasto pequeno por dia constrói o hábito de poupar melhor que qualquer corte grande e pontual. Veja como manter a sequência."
            body:
              - Cortes grandes e pontuais dão uma sensação boa e não mudam nada. O que muda o seu dinheiro é a repetição, e repetição depende de que a tarefa seja pequena o bastante para caber em qualquer dia.
              - Um gasto evitado por dia é uma meta que sobrevive a semana ruim, viagem e imprevisto. A sequência de dias existe para tornar visível essa constância, que de outro jeito passaria despercebida.
            steps:
              - Escolha um único gasto pequeno para evitar hoje, sem planejar a semana inteira.
              - Registre assim que evitar, ainda com a decisão fresca na memória.
              - Se quebrar a sequência, recomece no dia seguinte sem tentar compensar.
              - Olhe a sequência de vez em quando. Ela é o placar do hábito, não do valor.
            math: Um gasto evitado de cerca de cinco reais por dia soma perto de cento e cinquenta reais em um mês de trinta dias.
          - slug: de-nome-a-sua-meta
            icon: bi-bullseye
            title: Dê nome à sua meta
            text: "\"Viagem\" e \"reserva de emergência\" motivam mais que \"guardar dinheiro\". Vincule cada economia a uma meta e acompanhe a barra."
            description: "Metas com nome e prazo motivam muito mais que a ideia genérica de guardar dinheiro. Veja como nomear a sua e acompanhar o progresso."
            body:
              - Guardar dinheiro sem destino é um esforço sem recompensa visível. O cérebro precisa de uma imagem concreta para justificar o incômodo de dizer não a algo agora.
              - Nome, valor e prazo transformam a poupança num placar. Cada economia registrada empurra uma barra que você consegue ver, e ver o progresso é o que sustenta o hábito quando a novidade passa.
            steps:
              - Escolha algo específico, como uma viagem, um curso ou a reserva de emergência.
              - Defina o valor total e uma data realista, mesmo que aproximada.
              - Vincule cada economia registrada à meta correspondente.
              - Acompanhe a barra de progresso pelo menos uma vez por semana.
          - slug: transfira-o-que-economizou
            icon: bi-bank
            title: Transfira o que economizou
            text: No fim da semana, mova para a poupança ou para uma conta separada o total que você registrou aqui. Assim a economia sai do papel.
            description: "Registrar a economia é metade do caminho. Transferir o valor para uma conta separada toda semana é o que torna o dinheiro real."
            body:
              - Enquanto o dinheiro economizado continuar na conta corrente, ele vai ser gasto em outra coisa. O registro serve para você enxergar o valor, mas enxergar não protege.
              - A transferência semanal fecha o ciclo. Ela move o valor para fora do alcance do gasto do dia a dia e transforma um número na tela em dinheiro que existe de fato.
            steps:
              - Escolha um dia fixo da semana, de preferência logo depois de receber.
              - Abra o total economizado no período e transfira exatamente esse valor.
              - Use uma conta separada da conta do dia a dia, para não misturar.
              - Deixe o dinheiro rendendo, mesmo que numa aplicação simples com liquidez diária.
          - slug: olhe-o-relatorio-todo-mes
            icon: bi-bar-chart-line
            title: Olhe o relatório todo mês
            text: Descubra qual categoria mais rendeu e onde ainda dá para melhorar. O que é medido tende a crescer.
            description: "Uma revisão mensal do relatório mostra qual categoria mais rendeu e onde ainda sobra espaço. Veja o que olhar em cinco minutos."
            body:
              - Sem revisão, você repete as mesmas escolhas por meses sem saber quais delas realmente valeram. O relatório existe para separar o que funcionou do que só pareceu funcionar.
              - Cinco minutos por mês bastam. O objetivo não é auditar cada lançamento, é identificar a categoria campeã e a categoria esquecida, e ajustar o mês seguinte a partir disso.
            steps:
              - Abra o relatório no primeiro dia útil de cada mês.
              - Veja qual categoria mais rendeu e reforce o hábito ligado a ela.
              - Veja qual categoria ficou vazia e escolha uma dica dela para o mês novo.
              - Compare com o mês anterior antes de definir a meta seguinte.

