  legal:
    account_deletion:
      title: Como excluir sua conta
      description: "Passo a passo para apagar sua conta do Poupinho e todos os dados guardados nela."
      intro: Você pode apagar sua conta do Poupinho a qualquer momento, sem precisar falar com ninguém. A exclusão é imediata e não tem volta.
      steps_title: Pelo app ou pelo site
      steps:
        - Entre na sua conta em poupinho.com.br ou pelo app.
        - Abra o menu do seu nome, no topo, e escolha "Meu perfil".
        - Vá até o fim da página, na seção "Excluir conta".
        - Digite seu e-mail para confirmar e toque em "Excluir minha conta".
      deleted_title: O que é apagado
      deleted:
        - Sua conta, com nome, e-mail, telefone e foto de perfil.
        - Todas as economias que você registrou.
        - Suas metas e categorias.
        - Os aparelhos cadastrados para receber lembretes.
      retained_title: O que fica
      retained: Nada fica guardado depois da exclusão. Não mantemos cópia dos seus dados, e registros técnicos de acesso do servidor, que não identificam você, são descartados na rotação normal dos logs.
      contact_title: Sem acesso à conta?
      contact_html: Se você não consegue mais entrar, escreva para %{email} do endereço cadastrado e apagamos a conta para você.
    updated: "Última atualização: %{date}"
    contact_html: "Dúvidas ou pedidos sobre seus dados: <a href=\"mailto:%{email}\">%{email}</a>."
    privacy:
      title: Política de Privacidade
      description: Como o Poupinho coleta, usa e protege os seus dados.
      sections:
        - title: Quem somos
          paragraphs:
            - "O Poupinho (poupinho.com.br) é um aplicativo para registrar o dinheiro que você deixou de gastar e acompanhar sua evolução. Esta política explica quais dados coletamos, por que e como você pode exercer seus direitos, em linha com a Lei Geral de Proteção de Dados (LGPD)."
        - title: Dados que coletamos
          items:
            - "Dados de cadastro: nome, e-mail e celular. Ao entrar com o Google, recebemos do Google seu nome, e-mail e identificador de conta; não recebemos sua senha do Google."
            - "Dados de uso: as economias que você registra (valor, descrição, data, categoria e meta), suas metas e categorias, e as preferências do app."
            - "Notificações: se você ativar os lembretes, guardamos a assinatura de notificação do seu navegador ou celular."
            - "Dados técnicos: endereço IP e identificação do navegador nas sessões de login, para segurança."
        - title: Para que usamos
          items:
            - "Manter sua conta e mostrar seus painéis, relatórios, metas, pontos e nível."
            - "Enviar o lembrete diário, quando você ativar as notificações."
            - "Entrar em contato sobre a sua conta, se necessário."
            - "Proteger o serviço contra acessos indevidos."
        - title: Com quem compartilhamos
          paragraphs:
            - "Não vendemos nem cedemos seus dados a terceiros para publicidade. Usamos provedores de infraestrutura para hospedar o serviço (servidores e rede de entrega), o Google para autenticar quem escolhe entrar com a conta Google e, se você aceitar os cookies, o Google Analytics para estatísticas de uso do site. Esses provedores tratam os dados sob nossas instruções."
        - title: Por quanto tempo guardamos
          paragraphs:
            - "Enquanto sua conta existir. Você pode pedir a exclusão da conta a qualquer momento pelo e-mail de contato; apagamos seus dados em até 30 dias, salvo obrigação legal de retenção."
        - title: Seus direitos
          items:
            - "Confirmar se tratamos seus dados e acessá-los."
            - "Corrigir dados incompletos ou desatualizados (você mesmo pode fazer isso no perfil)."
            - "Pedir a exclusão da conta e dos dados."
            - "Desativar os lembretes quando quiser, no perfil."
        - title: Cookies
          paragraphs:
            - "Usamos um cookie de sessão, necessário para manter você conectado, e o armazenamento local do navegador para preferências como o tema."
            - "Para entender como o Poupinho é usado (páginas visitadas, origem das visitas), usamos o Google Analytics, que grava cookies de estatística apenas se você aceitar no aviso exibido na primeira visita. Se recusar, nenhum cookie de estatística é gravado. Você pode mudar a escolha limpando os dados do site no navegador. Não usamos cookies de publicidade."
        - title: Alterações
          paragraphs:
            - "Podemos atualizar esta política. Mudanças relevantes serão avisadas no app. A data da última atualização aparece no topo desta página."
    terms:
      title: Termos de Uso
      description: Condições para usar o Poupinho.
      sections:
        - title: O serviço
          paragraphs:
            - "O Poupinho é um aplicativo gratuito para registrar o dinheiro que você deixou de gastar e acompanhar seus hábitos de economia. Ao criar uma conta ou entrar com o Google, você concorda com estes termos e com a Política de Privacidade."
        - title: Sua conta
          items:
            - "Você é responsável por manter suas credenciais em segurança e pelas atividades feitas com a sua conta."
            - "Informe dados verdadeiros e mantenha-os atualizados."
            - "É preciso ter pelo menos 18 anos, ou autorização de um responsável, para usar o serviço."
        - title: Uso aceitável
          items:
            - "Não use o serviço para fins ilícitos, nem tente acessar contas ou dados de outras pessoas."
            - "Não tente burlar limites, sobrecarregar ou interferir no funcionamento do serviço."
        - title: Não é aconselhamento financeiro
          paragraphs:
            - "Os números, simulações, pontos e níveis do Poupinho são registros e estimativas feitos a partir do que você informa. Eles não são recomendação de investimento nem aconselhamento financeiro."
        - title: Disponibilidade e alterações
          paragraphs:
            - "Fazemos o possível para manter o serviço no ar, mas ele é oferecido como está, sem garantia de disponibilidade ininterrupta. Podemos alterar, suspender ou encerrar funcionalidades, avisando quando a mudança for relevante."
        - title: Encerramento
          paragraphs:
            - "Você pode encerrar sua conta a qualquer momento pelo e-mail de contato. Podemos suspender contas que violem estes termos."
        - title: Alterações destes termos
          paragraphs:
            - "Podemos atualizar estes termos. A data da última atualização aparece no topo desta página."

