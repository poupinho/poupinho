  tips:
    index:
      title: Dicas para poupar
      seo_title: "Dicas para poupar dinheiro no dia a dia"
      seo_description: "15 dicas práticas para economizar em alimentação, transporte, assinaturas e hábitos. Cada uma com passo a passo e quanto dá para guardar por mês."
      subtitle: Ideias simples para transformar pequenos "não" em dinheiro guardado
      intro: Poupar não é cortar tudo. É trocar um gasto automático por uma escolha consciente e registrar aqui cada vez que fizer isso. Comece por uma ou duas dicas e vá somando.
