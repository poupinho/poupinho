      subtitle: Simples o bastante para usar todo dia. Completo o bastante para você não largar.
      items:
        - icon: bi-lightning-charge
          title: Registro em segundos
          text: Formulário rápido no dashboard e atalho no celular. Sem burocracia.
        - icon: bi-graph-up-arrow
          title: Dashboards por período
          text: Hoje, este mês, este ano e o total desde o início, com gráficos.
        - icon: bi-bullseye
          title: Meta mensal
          text: Defina quanto quer economizar e acompanhe a barra de progresso.
        - icon: bi-fire
          title: Sequência de dias
          text: Mantenha o hábito e veja quantos dias seguidos você economizou.
        - icon: bi-tags
          title: Categorias suas
          text: Alimentação, transporte, lazer… crie as categorias que fizerem sentido.
        - icon: bi-phone
          title: Instale no celular
          text: Funciona como app, com modo escuro e aviso quando você estiver offline.
    # Depoimentos ilustrativos (placeholders) até existirem relatos reais de usuários.
    testimonials:
      title: Quem já está poupando
      subtitle: Pequenos "não" que viraram dinheiro guardado. Histórias de quem registra todo dia.
      items:
        - name: Mariana S.
          role: Designer · Curitiba
          initials: MS
          color: "#f59e0b"
          highlight: R$ 1.240 em 3 meses
          text: Eu nunca soube quanto gastava com delivery até começar a anotar as vezes que cozinhei em casa. Em três meses juntei o suficiente para a passagem das férias.
        - name: Rafael A.
          role: Desenvolvedor · São Paulo
          initials: RA
          color: "#3b82f6"
          highlight: 47 dias seguidos
          text: A sequência de dias virou um joguinho. Registro o café que não comprei em dez segundos e vejo a barra da meta subir. Simples de um jeito que eu não largo.
        - name: Camila R.
          role: Professora · Belo Horizonte
          initials: CR
          color: "#ec4899"
          highlight: R$ 3.980 em 1 ano
          text: Criei uma meta chamada "reserva de emergência" e cada economia vai direto pra ela. Ver o total do ano no relatório foi a primeira vez que me senti no controle.
        - name: João P.
          role: Motorista de app · Recife
          initials: JP
          color: "#10b981"
          highlight: R$ 620 em 2 meses
          text: Trabalho na rua o dia todo e vivia parando pra lanchar. Agora levo marmita e anoto o que deixei de gastar entre uma corrida e outra. Instalei no celular e uso como app.
        - name: Beatriz L.
          role: Estudante · Porto Alegre
          initials: BL
          color: "#8b5cf6"
          highlight: 1º celular pago à vista
          text: Cancelei dois streamings que nem abria e registrei como economia mensal. Doze meses depois, comprei meu celular à vista com o que "sobrou".
        - name: Fernando M.
          role: Contador · Goiânia
          initials: FM
          color: "#0ea5e9"
          highlight: R$ 2.150 em 6 meses
          text: O que me convenceu foi o gráfico por categoria. Vi que "lazer" era o vilão, ajustei sem cortar tudo, e o total do mês dobrou sem eu sentir aperto.
