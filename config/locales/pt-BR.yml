pt-BR:
  date:
    formats:
      default: "%d/%m/%Y"
      short: "%d/%m"
      long: "%d de %B de %Y"
    day_names:
      - Domingo
      - Segunda-feira
      - Terça-feira
      - Quarta-feira
      - Quinta-feira
      - Sexta-feira
      - Sábado
    abbr_day_names:
      - Dom
      - Seg
      - Ter
      - Qua
      - Qui
      - Sex
      - Sáb
    month_names:
      - ~
      - Janeiro
      - Fevereiro
      - Março
      - Abril
      - Maio
      - Junho
      - Julho
      - Agosto
      - Setembro
      - Outubro
      - Novembro
      - Dezembro
    abbr_month_names:
      - ~
      - Jan
      - Fev
      - Mar
      - Abr
      - Mai
      - Jun
      - Jul
      - Ago
      - Set
      - Out
      - Nov
      - Dez
    order:
      - :day
      - :month
      - :year

  time:
    formats:
      default: "%d/%m/%Y %H:%M"
      short: "%d/%m %H:%M"
      long: "%d de %B de %Y, %H:%M"
    am: "am"
    pm: "pm"

  number:
    format:
      separator: ","
      delimiter: "."
      precision: 2
      significant: false
      strip_insignificant_zeros: false
    currency:
      format:
        format: "%u %n"
        unit: "R$"
        separator: ","
        delimiter: "."
        precision: 2
        significant: false
        strip_insignificant_zeros: false
    percentage:
      format:
        delimiter: "."
        format: "%n%"
    precision:
      format:
        delimiter: "."
    human:
      format:
        delimiter: "."
        precision: 2
        significant: true
        strip_insignificant_zeros: true

  support:
    array:
      words_connector: ", "
      two_words_connector: " e "
      last_word_connector: " e "

  errors:
    format: "%{attribute} %{message}"
    messages:
      inclusion: "não está incluído na lista"
      exclusion: "não está disponível"
      invalid: "não é válido"
      confirmation: "não é igual a %{attribute}"
      accepted: "deve ser aceito"
      empty: "não pode ficar em branco"
      blank: "não pode ficar em branco"
      present: "deve ficar em branco"
      too_long: "é muito longo (máximo: %{count} caracteres)"
      too_short: "é muito curto (mínimo: %{count} caracteres)"
      wrong_length: "não possui o tamanho esperado (%{count} caracteres)"
      not_a_number: "não é um número"
      not_an_integer: "não é um número inteiro"
      greater_than: "deve ser maior que %{count}"
      greater_than_or_equal_to: "deve ser maior ou igual a %{count}"
      equal_to: "deve ser igual a %{count}"
      less_than: "deve ser menor que %{count}"
      less_than_or_equal_to: "deve ser menor ou igual a %{count}"
      other_than: "deve ser diferente de %{count}"
      odd: "deve ser ímpar"
      even: "deve ser par"
      taken: "já está em uso"
      record_invalid: "A validação falhou: %{errors}"

  activerecord:
    errors:
      models:
        user:
          attributes:
            avatar:
              invalid_type: "deve ser uma imagem JPG, PNG, WebP ou GIF"
              too_large: "deve ter no máximo 5 MB"
      messages:
        record_invalid: "A validação falhou: %{errors}"
        restrict_dependent_destroy:
          has_one: "Não é possível excluir o registro porque existe um %{record} dependente"
          has_many: "Não é possível excluir o registro porque existem %{record} dependentes"
    models:
      user:
        one: Usuário
        other: Usuários
      category:
        one: Categoria
        other: Categorias
      saving:
        one: Economia
        other: Economias
      goal:
        one: Meta
        other: Metas
    attributes:
      user:
        name: Nome
        email_address: E-mail
        phone: Celular
        password: Senha
        password_confirmation: Confirmação de senha
        monthly_goal: Meta mensal
        avatar: Foto de perfil
      category:
        name: Nome
        icon: Ícone
        color: Cor
        position: Ordem
      saving:
        amount: Valor
        description: Descrição
        saved_on: Data
        category: Categoria
        category_id: Categoria
        goal: Meta
        goal_id: Meta
      goal:
        name: Nome
        icon: Ícone
        color: Cor
        target_amount: Valor da meta
        deadline: Prazo
        position: Ordem

  helpers:
    submit:
      create: Salvar
      update: Salvar
      submit: Salvar
